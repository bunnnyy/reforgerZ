<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ReforgerZ map legend</title>
<link rel="stylesheet" href="common/zone.css">
<script src="common/zone.js"></script>
<style>
  body { background: #1d2a2e; }
  .mapwrap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .mk { position: absolute; width: 48px; height: 48px; transform: translate(-50%, -50%); filter: drop-shadow(0 2px 2px rgba(0,0,0,.6)); }
  .mk.sm { width: 38px; height: 38px; }
  .you { position: absolute; width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent; border-bottom: 26px solid #fff; transform: translate(-50%, -50%) rotate(35deg); filter: drop-shadow(0 0 3px #000); }
  .ring { position: absolute; border: 2px dashed rgba(242,194,48,.8); border-radius: 50%; transform: translate(-50%, -50%); }
  .tagline { position: absolute; font: 700 16px 'JetBrains Mono'; color: #15171a; background: rgba(232,226,208,.9); padding: 3px 6px; transform: translate(-50%, 0); white-space: nowrap; letter-spacing: .06em; }
  .mk.plated, .mk { z-index: 1; }
  .mapkey { position: absolute; left: 96px; bottom: 190px; width: 540px; height: 316px; background: var(--panel); border: 1px solid var(--line); border-top: 5px solid var(--bone); padding: 14px 20px; }
  .mapkey .top { display: flex; justify-content: space-between; align-items: baseline; }
  .mapkey h2 { margin: 0; font: 800 26px 'Inter Display', Inter; letter-spacing: .14em; text-transform: uppercase; }
  .mapkey .sub { font: 700 13px 'JetBrains Mono'; color: var(--dim); letter-spacing: .12em; }
  .mapkey .cols { display: flex; gap: 20px; margin-top: 14px; }
  .mapkey .col { width: 240px; }
  .mapkey .li { display: flex; align-items: center; gap: 10px; height: 36px; font: 700 18px Inter; }
  .mapkey .li .ic { width: 28px; height: 28px; }
  .mapkey .foot { position: absolute; left: 20px; bottom: 14px; font: 600 13px 'JetBrains Mono'; color: var(--dim); letter-spacing: .08em; }
  .callout { position: absolute; font: 600 12px 'JetBrains Mono'; color: rgba(242,194,48,.85); letter-spacing: .1em; }
</style>
</head>
<body>
<script>
  window.RZ_TOWN_FONT = 19;
  window.RZ_TOWNS = [
    { name: 'Morton', x: 760, y: 640, size: 4, lx: -40, ly: 44 }, { name: 'Levie', x: 980, y: 560, size: 3, lx: 26, ly: 34 },
    { name: 'Gravette', x: 1160, y: 470, size: 5, lx: -30, ly: -34 }, { name: 'Chotain', x: 560, y: 250, size: 3, lx: 26, ly: 30 },
    { name: 'Montignac', x: 1500, y: 300, size: 4 }, { name: 'Saint Philippe', x: 1230, y: 880, size: 5, lx: -60, ly: 46 },
    { name: 'Meaux', x: 300, y: 820, size: 3, lx: 34, ly: -18 }, { name: 'Le Moule', x: 1600, y: 760, size: 3, lx: 40, ly: -30 },
    { name: 'Provins', x: 1330, y: 430, size: 2, lx: 24, ly: 30 }, { name: 'Durras', x: 1420, y: 560, size: 2, lx: -10, ly: 46 },
  ];
</script>
<div class="mapwrap"><canvas class="scene" data-scene="map"></canvas>
<div class="layer">
  <!-- places -->
  <i class="mk plated" data-i="marker_safehouse" style="left:760px;top:640px;color:var(--haven)"></i>
  <i class="mk plated" data-i="marker_safehouse" style="left:980px;top:560px;color:var(--haven)"></i>
  <i class="mk plated" data-i="marker_stronghold" style="left:560px;top:250px;color:var(--haven)"></i>
  <i class="mk plated" data-i="marker_stronghold" style="left:1160px;top:470px;color:var(--bastion)"></i>
  <i class="mk plated" data-i="marker_stronghold" style="left:1500px;top:300px;color:var(--redhand)"></i>
  <i class="mk plated" data-i="marker_outpost" style="left:1330px;top:430px;color:var(--bastion)"></i>
  <i class="mk plated" data-i="marker_outpost" style="left:1420px;top:560px;color:var(--redhand)"></i>
  <i class="mk plated" data-i="marker_lab" style="left:1230px;top:880px;color:var(--halcyon)"></i>
  <i class="mk sm plated" data-i="marker_outpost" style="left:1180px;top:850px;color:var(--halcyon)"></i>
  <!-- world -->
  <i class="mk plated" data-i="marker_power" style="left:700px;top:480px;color:var(--hazard)"></i>
  <i class="mk plated" data-i="marker_radio" style="left:640px;top:360px;color:var(--bone)"></i>
  <i class="mk plated" data-i="marker_checkpoint" style="left:140px;top:470px;color:var(--hazard)"></i>
  <i class="mk plated" data-i="marker_checkpoint" style="left:1610px;top:200px;color:var(--hazard)"></i>
  <div class="ring" style="left:1600px;top:760px;width:190px;height:190px"></div>
  <i class="mk plated" data-i="marker_event" style="left:1600px;top:760px;color:var(--hazard)"></i>
  <div class="tagline" style="left:1600px;top:796px">FOG BANK · 18 MIN</div>
  <i class="mk plated" data-i="marker_event" style="left:330px;top:400px;color:var(--hazard)"></i>
  <div class="tagline" style="left:330px;top:436px">FEVER WATER</div>
  <div class="you" style="left:930px;top:600px"></div>
</div></div>
<div class="layer">
  <div class="callout" style="left:96px;bottom:520px">THE MAP KEY, ZOOMED OUT. IT FADES AS YOU ZOOM IN; Y HIDES IT ▼</div>
  <div class="mapkey">
    <div class="top"><h2>Map key</h2><span class="sub">COLOUR: WHOSE IT IS</span></div>
    <div class="cols">
      <div class="col"><div class="label">Who holds what</div>
        <div class="li"><i class="plated" data-i="marker_stronghold" style="color:var(--bastion)"></i>Stronghold</div>
        <div class="li"><i class="plated" data-i="marker_outpost" style="color:var(--redhand)"></i>Outpost</div>
        <div class="li"><i class="plated" data-i="marker_safehouse" style="color:var(--haven)"></i>Haven safehouse</div>
        <div class="li"><i class="plated" data-i="marker_lab" style="color:var(--halcyon)"></i>Halcyon's lab</div>
      </div>
      <div class="col"><div class="label">The world</div>
        <div class="li"><i class="plated" data-i="marker_event" style="color:var(--hazard)"></i>World event</div>
        <div class="li"><i class="plated" data-i="marker_checkpoint" style="color:var(--hazard)"></i>Sealed checkpoint</div>
        <div class="li"><i class="plated" data-i="marker_power" style="color:var(--bone)"></i>Power station</div>
        <div class="li"><i class="plated" data-i="marker_radio" style="color:var(--bone)"></i>Radio station</div>
        <div class="li"><i data-i="marker_range" style="color:var(--hazard)"></i>A pack's ground</div>
      </div>
    </div>
    <div class="foot"><span class="key">I</span>/ <span class="key">Y</span> HIDE THE KEY</div>
  </div>
</div>
</body>
</html>
